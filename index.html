<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bulk</title>
<meta name="theme-color" content="#0a1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --blue:#0a84ff;--blue2:#4da3ff;
  --glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.12);--edge:rgba(255,255,255,.14);
  --t1:#f2f5fa;--t2:rgba(235,242,255,.64);--t3:rgba(235,242,255,.38);
  --green:#30d158;--orange:#ff9f0a;--red:#ff453a;--teal:#64d2ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--t1);background:#0a1020;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(60% 45% at 12% 8%,rgba(10,132,255,.38),transparent 62%),
  radial-gradient(50% 40% at 92% 28%,rgba(110,160,230,.26),transparent 62%),
  radial-gradient(70% 50% at 35% 100%,rgba(58,92,170,.40),transparent 62%),
  linear-gradient(180deg,#0a1020 0%,#0f1a30 100%)}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(124px + env(safe-area-inset-bottom))}
.page{display:none}.page.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.sub{color:var(--t2);font-size:14px;margin-top:4px}
.head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.glass,.card,.list{background:var(--glass);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);border:1px solid var(--edge);border-radius:22px;box-shadow:0 10px 34px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.13)}
.card{padding:16px;margin-bottom:14px}
.list{margin-bottom:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.li:last-child{border-bottom:none}
.li .grow{flex:1;min-width:0}
.li .t{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12px;color:var(--t2);margin-top:2px}
.grp{font-size:12px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin:4px 6px 8px}
.lh{padding:8px 14px;font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;background:rgba(0,0,0,.18);display:flex;justify-content:space-between}
.btn{background:var(--blue);color:#fff;border:none;border-radius:14px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.97);opacity:.9}
.btn.ghost{background:rgba(255,255,255,.12);color:var(--t1)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:12px}
.btn.full{width:100%}
.btn.red{background:rgba(255,69,58,.18);color:var(--red)}
.x{background:none;border:none;color:var(--t3);font-size:16px;padding:6px;cursor:pointer}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:13px;padding:3px;margin-bottom:14px;gap:2px;overflow-x:auto}
.seg button{flex:1;border:none;background:none;color:var(--t2);font-size:13px;font-weight:600;padding:8px 6px;border-radius:10px;cursor:pointer;white-space:nowrap;font-family:inherit}
.seg button.on{background:rgba(255,255,255,.2);color:var(--t1)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:rgba(255,255,255,.09);border:1px solid var(--edge);color:var(--t1);border-radius:20px;padding:7px 13px;font-size:13px;cursor:pointer;font-family:inherit}
.chip:active{background:rgba(10,132,255,.35)}
input,select{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);border-radius:13px;padding:12px;color:var(--t1);font-size:16px;font-family:inherit;outline:none}
input:focus,select:focus{border-color:var(--blue2)}
select option{background:#16213a}
label{display:block;font-size:12px;color:var(--t2);margin:10px 0 5px;font-weight:500}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.daynav button{background:rgba(255,255,255,.1);border:none;color:var(--t1);width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer}
.daynav b{font-size:16px}
.hero{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:124px;height:124px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:26px;font-weight:700;letter-spacing:-.02em}
.ring .c span{font-size:11px;color:var(--t2)}
.macros{flex:1;display:flex;flex-direction:column;gap:11px}
.mrow .mt{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-bottom:4px}
.mrow .mt b{color:var(--t1);font-weight:600}
.bar{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.tip{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--teal);line-height:1.4}
.empty{text-align:center;color:var(--t3);padding:26px 14px;font-size:14px}
.preview{width:100%;aspect-ratio:4/3;border-radius:18px;object-fit:cover;display:block;margin-bottom:12px;background:rgba(0,0,0,.25)}
.drop{aspect-ratio:4/3;border-radius:18px;border:1.5px dashed rgba(255,255,255,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--t2);margin-bottom:12px;font-size:14px;text-align:center;padding:20px}
.drop svg{width:44px;height:44px;stroke:var(--blue2);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.18);border-top-color:var(--blue2);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 8px}
@keyframes sp{to{transform:rotate(360deg)}}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;text-transform:uppercase;letter-spacing:.04em}
.badge.Push{background:rgba(191,90,242,.22);color:#d9a3ff}.badge.Pull{background:rgba(48,209,88,.2);color:#7ee79a}.badge.Legs{background:rgba(255,159,10,.22);color:#ffc15e}.badge.Rest,.badge.Cardio,.badge.Full{background:rgba(255,255,255,.12);color:var(--t2)}
.ex{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid rgba(255,255,255,.07)}
.sets{font-variant-numeric:tabular-nums;font-size:12px;font-weight:600;background:rgba(255,255,255,.1);padding:4px 9px;border-radius:9px;color:var(--t1)}
.glasses{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:12px 0}
.gl{aspect-ratio:3/4;border-radius:6px 6px 12px 12px;border:1px solid var(--edge);background:rgba(255,255,255,.06);cursor:pointer;position:relative;overflow:hidden}
.gl i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#64d2ff,#0a84ff);transition:height .3s}
.gl.f i{height:100%}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat .card{margin:0;padding:14px}
.stat b{font-size:24px;font-weight:700;letter-spacing:-.02em;display:block}
.stat span{font-size:12px;color:var(--t2)}
.chk{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);background:none;color:#fff;cursor:pointer;flex:none;font-size:14px}
.chk.on{background:var(--blue);border-color:var(--blue)}
.tabbar{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;height:66px;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(18,28,50,.55);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--edge);border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.14);z-index:20}
.tab{background:none;border:none;color:var(--t3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--blue2)}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center;z-index:50}
.sheetbg.open{display:flex}
.sheet{width:100%;max-width:560px;background:rgba(20,31,56,.86);backdrop-filter:blur(34px) saturate(170%);-webkit-backdrop-filter:blur(34px) saturate(170%);border:1px solid var(--edge);border-bottom:none;border-radius:28px 28px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:0 auto 14px}
.sheet h2{font-size:20px;margin-bottom:6px}
.btns{display:flex;gap:10px;margin-top:16px}.btns .btn{flex:1}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-90px);background:rgba(30,45,78,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--edge);padding:10px 18px;border-radius:20px;font-size:14px;font-weight:500;z-index:80;transition:transform .35s cubic-bezier(.2,.9,.3,1);max-width:90vw}
.toast.show{transform:translate(-50%,0)}
svg.chart{width:100%;height:auto;display:block}
.authgate{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:#0a1020}
.authgate.open{display:flex}
.authcard{width:100%;max-width:400px;background:var(--glass2);backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);border:1px solid var(--edge);border-radius:26px;padding:26px 22px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.authlogo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--blue2),var(--blue));display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:26px}
.authcard h1{font-size:24px;text-align:center;margin-bottom:4px}
.authcard .sub{text-align:center;margin-bottom:20px}
.social{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.social button{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border-radius:14px;border:1px solid var(--edge);background:rgba(255,255,255,.08);color:var(--t1);font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit}
.social button.google{background:#fff;color:#1f1f1f;border-color:#fff}
.social button.fb{background:#1877f2;color:#fff;border-color:#1877f2}
.divider{display:flex;align-items:center;gap:10px;color:var(--t3);font-size:12px;margin:14px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.14)}
.authtabs{display:flex;background:rgba(255,255,255,.08);border-radius:13px;padding:3px;margin-bottom:14px;gap:2px}
.authtabs button{flex:1;border:none;background:none;color:var(--t2);font-size:12.5px;font-weight:600;padding:7px 4px;border-radius:10px;cursor:pointer;font-family:inherit}
.authtabs button.on{background:rgba(255,255,255,.2);color:var(--t1)}
.authpane{display:none}.authpane.on{display:block}
.skip{display:block;width:100%;text-align:center;margin-top:16px;background:none;border:none;color:var(--t2);font-size:13px;cursor:pointer;text-decoration:underline;font-family:inherit}
.autherr{color:var(--red);font-size:12.5px;margin-top:8px;min-height:0;text-align:center}
.acctrow{display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--blue2),var(--blue));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none}
</style>
</head>
<body>
<div class="bg"></div>
<main class="app">
  <section class="page on" id="p-diet"></section>
  <section class="page" id="p-scan"></section>
  <section class="page" id="p-work"></section>
  <section class="page" id="p-more"></section>
</main>
<nav class="tabbar">
  <button class="tab on" data-t="diet" onclick="go('diet')"><svg viewBox="0 0 24 24"><path d="M12 3c-2.5 3-6 5.2-6 9.5A6 6 0 0 0 12 21a6 6 0 0 0 6-8.5C18 8.2 14.5 6 12 3Z"/></svg>Diet</button>
  <button class="tab" data-t="scan" onclick="go('scan')"><svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.2"/></svg>Scan</button>
  <button class="tab" data-t="work" onclick="go('work')"><svg viewBox="0 0 24 24"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>Workout</button>
  <button class="tab" data-t="more" onclick="go('more')"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>More</button>
</nav>
<div class="sheetbg" id="sbg" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fcam" accept="image/*" capture="environment" hidden onchange="onFile(this)">
<input type="file" id="flib" accept="image/*" hidden onchange="onFile(this)">
<div class="authgate" id="authgate"></div>
<div id="recaptcha-container"></div>

<script>
const KEY='bulk_glass_v1';
const MEALS=['Breakfast','Lunch','Pre-Workout','Post-Workout','Dinner','Snack'];
const QUICK=[['Eggs ×3',210,18,0,15,'Breakfast'],['Oats 80g',296,10,54,5,'Breakfast'],['Whey scoop',120,25,3,2,'Post-Workout'],['Soya chunks 50g',173,26,10,1,'Lunch'],['Peanut butter 2 tbsp',188,8,6,16,'Snack'],['Rice 1 cup',200,4,44,0,'Lunch'],['Chicken 150g',248,46,0,5,'Lunch'],['Banana',105,1,27,0,'Snack'],['Dal 1 cup',180,12,30,3,'Dinner'],['Paneer 100g',265,18,1,21,'Dinner'],['Milk 300ml',150,8,14,8,'Breakfast'],['Curd 200g',120,7,9,5,'Lunch'],['Roti ×2',160,5,32,2,'Dinner'],['Almonds 30g',174,6,6,15,'Snack']];
const W=(day,title,tag,ex)=>({day,title,tag,ex:ex.map(([n,s,note])=>({n,s,note}))});
const DEFAULT_WORKOUTS=()=>[
 W('Day 1','Push A','Push',[['Incline barbell press','4×6-8','Elbows ~45°'],['Flat DB press','3×8-10','Full range'],['Cable fly','3×12','Squeeze at centre'],['DB shoulder press','4×8-10','No lockout'],['Lateral raise','3×15','Lead with elbows'],['Tricep pushdown','3×12','Elbows pinned'],['Overhead tricep extension','3×10','Long head stretch']]),
 W('Day 2','Pull A','Pull',[['Deadlift','4×5','Brace hard'],['Barbell row','4×6-8','Chest to bar'],['Lat pulldown','3×10-12','Full stretch'],['Seated cable row','3×12','Elbows tight'],['Face pulls','3×15','External rotation'],['Hammer curl','3×10','Slow lowering'],['EZ-bar curl','3×10','No swing']]),
 W('Day 3','Legs A','Legs',[['Leg press','4×10-12','Ankle-friendly'],['Romanian deadlift','3×8-10','Hinge at hips'],['Leg curl','3×12','Squeeze at top'],['Leg extension','3×15','Quad isolation'],['Seated calf raise','4×15','Slow lowering'],['Hip abduction','3×15','Glute medius']]),
 W('Day 4','Push B','Push',[['Flat barbell bench','4×6-8','Leg drive'],['Incline DB press','3×10','30° incline'],['Cable crossover','3×12','Mid-chest squeeze'],['Arnold press','3×10','Full rotation'],['Rear delt fly','3×15','Elbows wide'],['Close-grip bench','3×10','Triceps focus'],['Skull crushers','3×10','Slow lowering']]),
 W('Day 5','Pull B','Pull',[['Pull-ups','4×6-10','Dead hang'],['T-bar row','4×8','Elbows back'],['One-arm DB row','3×10','Full retraction'],['Cable pullover','3×12','Lat stretch'],['Preacher curl','3×10','No momentum'],['Concentration curl','3×12','Peak squeeze']]),
 W('Day 6','Legs B','Legs',[['Bulgarian split squat','4×8','Ankle-friendly squat'],['Hip thrust','4×10','Squeeze glutes'],['Walking lunges','3×12','Flat-foot landing'],['Narrow leg press','3×12','Inner quad'],['Nordic curl','3×6-8','Go slow'],['Standing calf raise','4×12','Pause at bottom']]),
 W('Day 7','Rest','Rest',[])
];
const DEFAULT_STATE=()=>({goals:{kcal:2800,pro:160,carb:330,fat:70},days:{},workouts:DEFAULT_WORKOUTS(),supps:[{n:'Creatine',d:'5g',w:'Post-workout'},{n:'Whey protein',d:'30g',w:'Post-workout'},{n:'Vitamin D3+K2',d:'5000 IU',w:'Morning'},{n:'Magnesium',d:'400mg',w:'Night'}],apiBase:'',startWeight:55});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=Object.assign(DEFAULT_STATE(),S||{});
const save=()=>{localStorage.setItem(KEY,JSON.stringify(S));if(user&&db){clearTimeout(syncT);syncT=setTimeout(syncUp,900)}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const keyAt=o=>{const d=new Date();d.setDate(d.getDate()+o);return fmt(d)};
const day=k=>S.days[k]||(S.days[k]={foods:[],water:0,weight:null,sleep:null,supps:{},done:false});
let off=0,tab='diet',moreTab='water',openDay=-1,scan={img:null,items:[],scale:1,busy:false,err:''};
const cur=()=>day(keyAt(off));
const totals=d=>d.foods.reduce((a,f)=>({kcal:a.kcal+f.kcal,pro:a.pro+f.pro,carb:a.carb+f.carb,fat:a.fat+f.fat}),{kcal:0,pro:0,carb:0,fat:0});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}
function openSheet(h){$('#sheet').innerHTML='<div class="grab"></div>'+h;$('#sbg').classList.add('open')}
function closeSheet(){$('#sbg').classList.remove('open')}
function go(t){tab=t;document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='p-'+t));document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render();window.scrollTo(0,0)}
function render(){({diet:rDiet,scan:rScan,work:rWork,more:rMore})[tab]()}
const ico={cam:'<svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.2"/></svg>'};

/* ───────── ACCOUNTS (Firebase Auth + Firestore sync) ─────────
   Paste your Firebase project config below (Firebase console → Project settings →
   Your apps → Web app). This config is NOT a secret — safe to ship in client code,
   unlike the Anthropic key in api/scan.js. Leave apiKey as 'YOUR_API_KEY' to run the
   app fully local-only, exactly as before — no gate, no login, nothing changes. */
const FIREBASE_CONFIG={apiKey:'YOUR_API_KEY',authDomain:'YOUR_PROJECT.firebaseapp.com',projectId:'YOUR_PROJECT',storageBucket:'YOUR_PROJECT.appspot.com',messagingSenderId:'YOUR_SENDER_ID',appId:'YOUR_APP_ID'};
let fbApp=null,auth=null,db=null,fbReady=false,user=null,authMode='in',otpSent=false,confirmationResult=null,syncT=null;
try{
  if(typeof firebase!=='undefined'&&FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.apiKey!=='YOUR_API_KEY'){
    fbApp=firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();fbReady=true;
  }
}catch(e){console.error('Firebase init failed:',e)}

function renderGate(err){
  $('#authgate').innerHTML=`<div class="authcard">
    <div class="authlogo">🍽️</div>
    <h1>Welcome</h1><div class="sub">Sign in to sync your data across devices</div>
    <div class="social">

    </div>
    ${err?`<div class="autherr">${esc(err)}</div>`:''}

}
function hideGate(){$('#authgate').classList.remove('open');$('#authgate').innerHTML=''}
function skipAuth(){localStorage.setItem('bulk_skip_auth','1');hideGate();render()}
async function gAuth(which){
  try{const p=which==='google'?new firebase.auth.GoogleAuthProvider():new firebase.auth.FacebookAuthProvider();await auth.signInWithPopup(p)}
  catch(e){renderGate(e.message)}
}
async function emailAuth(){
  const email=$('#aEmail').value.trim(),pass=$('#aPass').value;
  if(!email||pass.length<6)return renderGate('Enter a valid email and a password of 6+ characters.');
  try{if(authMode==='up')await auth.createUserWithEmailAndPassword(email,pass);else await auth.signInWithEmailAndPassword(email,pass)}
  catch(e){renderGate(e.message)}
}
function sendOtp(){
  const num=$('#aPhone').value.trim();
  if(!num)return renderGate('Enter your phone number with country code, e.g. +91...');
  try{
    if(!window.recaptchaVerifier)window.recaptchaVerifier=new firebase.auth.RecaptchaVerifier('recaptcha-container',{size:'invisible'},auth);
    auth.signInWithPhoneNumber(num,window.recaptchaVerifier).then(r=>{confirmationResult=r;otpSent=true;renderGate()}).catch(e=>renderGate(e.message));
  }catch(e){renderGate(e.message)}
}
function verifyOtp(){
  const code=$('#aCode').value.trim();
  if(!confirmationResult||!code)return renderGate('Enter the code we texted you.');
  confirmationResult.confirm(code).catch(e=>renderGate(e.message));
}
function signOutUser(){auth.signOut().then(()=>{localStorage.removeItem('bulk_skip_auth');location.reload()})}
async function syncUp(){if(!user||!db)return;try{await db.collection('users').doc(user.uid).set({state:S,updatedAt:Date.now()})}catch(e){console.error('sync up failed',e)}}
async function syncDown(){
  if(!user||!db)return;
  try{
    const snap=await db.collection('users').doc(user.uid).get();
    if(snap.exists&&snap.data().state)S=Object.assign(DEFAULT_STATE(),snap.data().state);else await syncUp();
    localStorage.setItem(KEY,JSON.stringify(S));
  }catch(e){console.error('sync down failed',e)}
  hideGate();render();
}
function initAuth(){
  if(!fbReady)return render();
  auth.onAuthStateChanged(u=>{
    user=u;
    if(u)syncDown();
    else if(localStorage.getItem('bulk_skip_auth')==='1'){hideGate();render()}
    else renderGate();
  });
}

/* ───────── DIET ───────── */
function dayLabel(){if(off===0)return'Today';if(off===-1)return'Yesterday';if(off===1)return'Tomorrow';return new Date(keyAt(off)+'T00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}
function rDiet(){
  const d=cur(),t=totals(d),g=S.goals,C=2*Math.PI*54,p=Math.min(1,t.kcal/g.kcal);
  const left=Math.round(g.kcal-t.kcal),pl=Math.round(g.pro-t.pro);
  let tip=t.kcal===0?'Nothing logged yet. Use Scan to photograph a meal, or tap a quick add below.':t.pro<g.pro*.5&&t.kcal>g.kcal*.5?'Protein is behind. Add whey, soya chunks or chicken.':left>0?`${left} kcal and ${Math.max(0,pl)} g protein to go.`:'Calorie goal hit. Prioritise sleep and water tonight.';
  const mr=(l,v,goal,c)=>`<div class="mrow"><div class="mt"><span>${l}</span><span><b>${Math.round(v)}</b> / ${goal} g</span></div><div class="bar"><i style="width:${Math.min(100,v/goal*100)}%;background:${c}"></i></div></div>`;
  let list='';
  MEALS.forEach(m=>{const items=d.foods.map((f,i)=>({f,i})).filter(x=>x.f.meal===m);if(!items.length)return;
    const mk=items.reduce((a,x)=>a+x.f.kcal,0);
    list+=`<div class="lh"><span>${m}</span><span>${mk} kcal</span></div>`+items.map(({f,i})=>`<div class="li"><div class="grow"><div class="t">${esc(f.name)}</div><div class="s">${f.kcal} kcal · P ${f.pro} · C ${f.carb} · F ${f.fat}</div></div><button class="x" onclick="delFood(${i})">✕</button></div>`).join('')});
  $('#p-diet').innerHTML=`
  <div class="head"><div><h1>Diet</h1><div class="sub">${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</div></div></div>
  <div class="daynav"><button onclick="off--;rDiet()">‹</button><b>${dayLabel()}</b><button onclick="off++;rDiet()">›</button></div>
  <div class="card"><div class="hero">
    <div class="ring"><svg width="124" height="124" viewBox="0 0 124 124"><circle cx="62" cy="62" r="54" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="11"/><circle cx="62" cy="62" r="54" fill="none" stroke="url(#rg)" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" style="transition:stroke-dashoffset .6s"/><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#64d2ff"/><stop offset="1" stop-color="#0a84ff"/></linearGradient></defs></svg>
    <div class="c"><b>${Math.round(t.kcal)}</b><span>of ${g.kcal} kcal</span></div></div>
    <div class="macros">${mr('Protein',t.pro,g.pro,'#30d158')}${mr('Carbs',t.carb,g.carb,'#64d2ff')}${mr('Fat',t.fat,g.fat,'#ff9f0a')}</div>
  </div></div>
  <div class="card"><div class="tip"><span>💡</span><span>${tip}</span></div></div>
  <div class="grp">Quick add</div>
  <div class="chips">${QUICK.map((q,i)=>`<button class="chip" onclick="quick(${i})">${q[0]}</button>`).join('')}</div>
  <div class="head" style="margin:6px 0 10px"><div class="grp" style="margin:0">Meals</div><button class="btn sm ghost" onclick="foodSheet()">+ Add food</button></div>
  <div class="list">${list||'<div class="empty">No meals yet.</div>'}</div>`;
}
function quick(i){const q=QUICK[i];cur().foods.push({name:q[0],kcal:q[1],pro:q[2],carb:q[3],fat:q[4],meal:q[5]});save();rDiet();toast('Added '+q[0])}
function delFood(i){cur().foods.splice(i,1);save();rDiet()}
function foodSheet(){openSheet(`<h2>Add food</h2>
  <label>Name</label><input id="fn" placeholder="e.g. Chicken breast">
  <div class="g2"><div><label>Calories</label><input id="fk" type="number" inputmode="decimal"></div><div><label>Protein g</label><input id="fp" type="number" inputmode="decimal"></div><div><label>Carbs g</label><input id="fc" type="number" inputmode="decimal"></div><div><label>Fat g</label><input id="ff" type="number" inputmode="decimal"></div></div>
  <label>Meal</label><select id="fm">${MEALS.map(m=>`<option>${m}</option>`).join('')}</select>
  <div class="btns"><button class="btn ghost" onclick="closeSheet()">Cancel</button><button class="btn" onclick="saveFood()">Add</button></div>`)}
function saveFood(){const n=$('#fn').value.trim();if(!n)return;const v=id=>Math.round(+$(id).value)||0;
  cur().foods.push({name:n,kcal:v('#fk'),pro:v('#fp'),carb:v('#fc'),fat:v('#ff'),meal:$('#fm').value});save();closeSheet();rDiet()}

/* ───────── SCAN ───────── */
function rScan(){
  const sc=scan.scale,it=scan.items;
  const sum=it.reduce((a,f)=>({k:a.k+f.kcal*sc,p:a.p+f.protein*sc,c:a.c+f.carbs*sc,f:a.f+f.fat*sc}),{k:0,p:0,c:0,f:0});
  let body='';
  if(scan.busy)body=`<div class="card" style="text-align:center;padding:30px"><div class="spin"></div><div class="sub">Analysing your meal…</div></div>`;
  else if(scan.err)body=`<div class="card"><div class="tip" style="color:var(--orange)"><span>⚠️</span><span>${esc(scan.err)}</span></div></div>`;
  if(it.length&&!scan.busy)body+=`
  <div class="card"><div class="grp" style="margin-left:0">Portion size · ${sc}×</div>
    <input type="range" min="0.5" max="2" step="0.25" value="${sc}" oninput="scan.scale=+this.value;rScan()" style="padding:0;height:28px;accent-color:#0a84ff">
  </div>
  <div class="list">${it.map((f,i)=>`<div class="li"><div class="grow"><div class="t">${esc(f.name)}</div><div class="s">${esc(f.serving)} · ${Math.round(f.kcal*sc)} kcal · P ${Math.round(f.protein*sc)} · C ${Math.round(f.carbs*sc)} · F ${Math.round(f.fat*sc)}</div></div><span class="badge Rest">${f.confidence}</span><button class="x" onclick="scan.items.splice(${i},1);rScan()">✕</button></div>`).join('')}
  <div class="lh"><span>Total</span><span style="color:var(--t1)">${Math.round(sum.k)} kcal · P ${Math.round(sum.p)}</span></div></div>
  <label style="margin-top:0">Add to meal</label><select id="sm">${MEALS.map(m=>`<option>${m}</option>`).join('')}</select>
  <button class="btn full" style="margin-top:12px" onclick="addScan()">Add to today's log</button>`;
  $('#p-scan').innerHTML=`
  <div class="head"><div><h1>Scan</h1><div class="sub">Photograph a meal. Claude estimates the nutrition.</div></div></div>
  ${scan.img?`<img class="preview" src="${scan.img}" alt="Meal photo">`:`<div class="drop">${ico.cam}<div>Take a clear photo from above with good light</div></div>`}
  <div class="g2" style="margin-bottom:14px"><button class="btn" onclick="$('#fcam').click()">Take photo</button><button class="btn ghost" onclick="$('#flib').click()">Choose photo</button></div>
  ${body}
  <div class="sub" style="text-align:center;margin-top:10px">Estimates only. Adjust portion size to match your plate.</div>`;
}
function prep(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const m=1024,r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.8))};
  im.onerror=()=>no(new Error('Could not read that image'));im.src=u})}
async function onFile(inp){const f=inp.files[0];inp.value='';if(!f)return;
  try{scan={img:await prep(f),items:[],scale:1,busy:true,err:''}}catch(e){scan={img:null,items:[],scale:1,busy:false,err:e.message};rScan();return}
  go('scan');
  try{
    const r=await fetch((S.apiBase||'')+'/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:scan.img.split(',')[1],mediaType:'image/jpeg'})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||'Scan failed ('+r.status+')');
    scan.items=j.foods||[];if(!scan.items.length)scan.err='No food detected. Try a closer, brighter photo.';
  }catch(e){scan.err=/Failed to fetch|NetworkError/i.test(e.message)?'Cannot reach the scan server. Check your internet, or the API address in More → Settings.':e.message}
  scan.busy=false;rScan()}
function addScan(){const m=$('#sm').value,sc=scan.scale,d=cur();
  scan.items.forEach(f=>d.foods.push({name:f.name+(f.serving?' ('+f.serving+')':''),kcal:Math.round(f.kcal*sc),pro:Math.round(f.protein*sc),carb:Math.round(f.carbs*sc),fat:Math.round(f.fat*sc),meal:m}));
  save();scan={img:null,items:[],scale:1,busy:false,err:''};toast('Added to your log');off=0;go('diet')}

      :`<div class="acctrow"><div class="grow"><div class="t">Not signed in</div><div class="s">Data is local to this device only</div></div><button class="btn sm" onclick="localStorage.removeItem('bulk_skip_auth');renderGate()">Sign in</button></div>`;
    body=`<div class="card"><div class="grp" style="margin-left:0">Account</div>${acct}</div>
    <div class="card"><div class="grp" style="margin-left:0">Daily goals</div><div class="g2">
      <div><label>Calories</label><input type="number" value="${g.kcal}" onchange="S.goals.kcal=+this.value||g.kcal;save()"></div><div><label>Protein g</label><input type="number" value="${g.pro}" onchange="S.goals.pro=+this.value||1;save()"></div>
      <div><label>Carbs g</label><input type="number" value="${g.carb}" onchange="S.goals.carb=+this.value||1;save()"></div><div><label>Fat g</label><input type="number" value="${g.fat}" onchange="S.goals.fat=+this.value||1;save()"></div>
      <div><label>Start weight kg</label><input type="number" step="0.1" value="${S.startWeight}" onchange="S.startWeight=+this.value||55;save()"></div></div></div>
    <div class="card"><div class="grp" style="margin-left:0">Scan server</div><label>API address (leave empty when hosted on Vercel)</label><input value="${esc(S.apiBase)}" placeholder="https://your-app.vercel.app" onchange="S.apiBase=this.value.trim().replace(/\\/$/,'');save()"></div>
    <div class="g2"><button class="btn ghost" onclick="exportData()">Export data</button><button class="btn red" onclick="if(confirm('Erase ALL data on this device?')){localStorage.removeItem(KEY);location.reload()}">Erase all</button></div>`}
  $('#p-more').innerHTML=`<div class="head"><div><h1>More</h1><div class="sub">Water, body, supplements, charts</div></div></div>
  <div class="seg">${tabs.map(t=>`<button class="${moreTab===t[0]?'on':''}" onclick="moreTab='${t[0]}';rMore()">${t[1]}</button>`).join('')}</div>${body}`;
}
function setWater(i){const d=day(keyAt(0));d.water=(d.water>i)?i:i+1;save();rMore()}
function togSupp(i){const d=day(keyAt(0));d.supps[i]=!d.supps[i];save();rMore()}
function delSupp(i){S.supps.splice(i,1);save();rMore()}
function suppSheet(){openSheet(`<h2>Add supplement</h2><label>Name</label><input id="sn"><div class="g2"><div><label>Dose</label><input id="sd" placeholder="5g"></div><div><label>When</label><select id="sw"><option>Morning</option><option>Pre-workout</option><option>Post-workout</option><option>With food</option><option>Night</option></select></div></div><div class="btns"><button class="btn ghost" onclick="closeSheet()">Cancel</button><button class="btn" onclick="saveSupp()">Add</button></div>`)}
function saveSupp(){const n=$('#sn').value.trim();if(!n)return;S.supps.push({n,d:$('#sd').value.trim(),w:$('#sw').value});save();closeSheet();rMore()}
function wtSheet(){openSheet(`<h2>Log weight</h2><label>Weight (kg)</label><input id="wv" type="number" step="0.1" inputmode="decimal" autofocus><div class="btns"><button class="btn ghost" onclick="closeSheet()">Cancel</button><button class="btn" onclick="const v=+$('#wv').value;if(v>0){day(keyAt(0)).weight=v;save();closeSheet();rMore()}">Save</button></div>`)}
function sleepSheet(){openSheet(`<h2>Log sleep</h2><label>Hours slept last night</label><input id="sv" type="number" step="0.5" inputmode="decimal"><div class="btns"><button class="btn ghost" onclick="closeSheet()">Cancel</button><button class="btn" onclick="const v=+$('#sv').value;if(v>0){day(keyAt(0)).sleep=v;save();closeSheet();rMore()}">Save</button></div>`)}
function exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='bulk-data-'+keyAt(0)+'.json';a.click();toast('Exported')}

/* tiny SVG charts (no libraries, works offline) */
function bars(v,goal,lab,col){const W=300,H=120,max=Math.max(goal,...v,1)*1.1,bw=W/v.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H+18}">${v.map((x,i)=>{const h=x/max*H;return `<rect x="${i*bw+7}" y="${H-h}" width="${bw-14}" height="${h}" rx="6" fill="${col}" opacity="${x?0.9:0.15}"/><text x="${i*bw+bw/2}" y="${H+14}" text-anchor="middle" font-size="10" fill="rgba(235,242,255,.5)">${lab[i]}</text>`}).join('')}<line x1="0" x2="${W}" y1="${H-goal/max*H}" y2="${H-goal/max*H}" stroke="rgba(255,255,255,.4)" stroke-dasharray="4 4"/></svg>`}
function line(v){const W=300,H=110,mn=Math.min(...v)-.5,mx=Math.max(...v)+.5,p=v.map((x,i)=>[i/(v.length-1)*W,H-(x-mn)/(mx-mn)*H]);
  return `<svg class="chart" viewBox="0 0 ${W} ${H+6}"><polyline points="${p.map(a=>a.join(',')).join(' ')}" fill="none" stroke="#64d2ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${p.map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="3.5" fill="#0a84ff"/>`).join('')}</svg>`}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
initAuth();
</script>
</body>
</html>
